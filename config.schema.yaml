$schema: https://json-schema.org/draft/2020-12/schema
title: gobalprotect config
type: object
properties:
  default_profile:
    type: string
    description: Name of the default profile to use when --profile is not specified.
  profiles:
    type: array
    description: List of tunnel profiles.
    items:
      type: object
      properties:
        name:
          type: string
          description: Profile name used to select this tunnel.
        server:
          type: string
          description: GlobalProtect gateway address.
        username:
          type: string
          description: Username for password authentication.
        password_cmd:
          type: string
          description: Shell command to execute to obtain password (stdout is used, 10s timeout).
        cookie_name:
          type: string
          description: Cookie/token field name for SAML auth (e.g. prelogin-cookie).
        insecure:
          type: boolean
          description: Skip TLS certificate verification.
          default: false
        tun:
          type: string
          description: TUN device name. If empty, auto-assigned.
        as_default_route:
          type: boolean
          description: Set default route through VPN tunnel.
          default: false
        verbose:
          type: boolean
          description: Enable debug logging.
          default: false
        log_json:
          type: boolean
          description: Output logs in JSON format.
          default: false
        no_routes:
          type: boolean
          description: Don't add split-tunnel routes from server config.
          default: false
        no_dns:
          type: boolean
          description: Don't configure DNS from server config.
          default: false
        otp_cmd:
          type: string
          description: Shell command to execute to obtain OTP (stdout is used, 10s timeout).
        computer:
          type: string
          description: Computer name to report to the gateway.
        no_serve_dns:
          type: boolean
          description: Don't start a local DNS server for split-tunneling domains.
          default: false
        serve_dns_port:
          type: integer
          description: Port for the local DNS server.
          default: 1553
        dns_cache_size:
          type: integer
          description: Maximum number of cached DNS responses (0 to disable, default 256).
          default: 256
      required:
        - name
        - server
required:
  - profiles
